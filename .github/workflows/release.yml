name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
        if: matrix.target == 'apk'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release
        if: matrix.target == 'windows'

      - name: Build APK
        run: flutter build apk --release
        if: matrix.target == 'apk'

      - name: Zip Windows build
        run: |
          cd build/windows/x64/runner/Release
          7z a ../../../glint_reader-windows-x64.zip .
        if: matrix.target == 'windows'

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk glint_reader-android.apk
        if: matrix.target == 'apk'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glint_reader-${{ matrix.target }}
          path: |
            glint_reader-windows-x64.zip
            glint_reader-android.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/glint_reader-windows-x64.zip
            dist/glint_reader-android.apk
          generate_release_notes: true
