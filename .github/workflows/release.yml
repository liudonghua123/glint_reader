name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
        if: matrix.target == 'apk'

      # Linux 构建需要 GTK 开发头文件与 Ninja
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
        if: matrix.target == 'linux'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Android release 签名：从 Secrets 解码固定 keystore，
      # 保证每次构建 APK 签名一致（应用内更新可直接覆盖安装）。
      - name: Prepare Android signing keystore
        if: matrix.target == 'apk'
        env:
          GLINT_KEYSTORE_BASE64: ${{ secrets.GLINT_KEYSTORE_BASE64 }}
        run: |
          echo "$GLINT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glint-reader-release.jks"
          echo "GLINT_KEYSTORE_FILE=$RUNNER_TEMP/glint-reader-release.jks" >> "$GITHUB_ENV"
          echo "GLINT_KEYSTORE_PASSWORD=glint-reader-2026" >> "$GITHUB_ENV"
          echo "GLINT_KEY_ALIAS=glint-reader" >> "$GITHUB_ENV"

      - name: Build Windows
        run: flutter build windows --release
        if: matrix.target == 'windows'

      - name: Build macOS
        run: flutter build macos --release
        if: matrix.target == 'macos'

      - name: Build Linux
        run: flutter build linux --release
        if: matrix.target == 'linux'

      - name: Build APK
        run: flutter build apk --release
        if: matrix.target == 'apk'

      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath glint_reader-windows-x64.zip -Force
        if: matrix.target == 'windows'

      - name: Zip macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/glint_reader-macos.zip" glint_reader.app
        if: matrix.target == 'macos'

      - name: Tar Linux build
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/glint_reader-linux-x64.tar.gz" .
        if: matrix.target == 'linux'

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk glint_reader-android.apk
        if: matrix.target == 'apk'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glint_reader-${{ matrix.target }}
          path: |
            glint_reader-windows-x64.zip
            glint_reader-macos.zip
            glint_reader-linux-x64.tar.gz
            glint_reader-android.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/glint_reader-windows-x64.zip
            dist/glint_reader-macos.zip
            dist/glint_reader-linux-x64.tar.gz
            dist/glint_reader-android.apk
          generate_release_notes: true
